map $http_origin $cors_origin {
    default "";
    "~^http://localhost:4200$" $http_origin;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the federation manifest or remoteEntry: they decide
    # which version of the portal the shell loads (Anexo H, rule 4).
    # NOTE: nginx's add_header at location level REPLACES server-level
    # add_header directives, so the CORS headers must be repeated in
    # every location that sets its own headers.
    location = /remoteEntry.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Vary "Origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        try_files $uri =404;
    }

    # Never cache the federation chunks that change with each build.
    location ~* \.(?:js|mjs)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Vary "Origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        try_files $uri =404;
    }

    # Cache immutable assets (images, fonts) for a week.
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Vary "Origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        try_files $uri =404;
    }

    # SPA fallback: any unknown path resolves to index.html.
    location / {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Vary "Origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        try_files $uri $uri/ /index.html;
    }
}